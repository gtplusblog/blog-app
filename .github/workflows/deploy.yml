# 把 APP/ 目录构建并发布到 GitHub Pages（独立的 blog-app 仓库）
#
# 前提：只把 APP 目录推到一个单独的 GitHub 仓库（例如 gtplusblog/blog-app），
# 并在该仓库 Settings → Pages → Source 选择 "GitHub Actions"。
#
# 这个工作流只属于 App 自己的仓库，完全不会碰 gtplusblog.github.io。
name: Deploy Blog App to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # version 交给 package.json 的 packageManager 决定（pnpm@11.7.0），
      # 避免「workflow 里的 pnpm 版本」和「生成 lockfile 的版本」不一致。
      # 这里的版本号只作为 packageManager 缺失时的兜底。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # 把每一步的输出同时写到 ci-logs/，失败时随 artifact 上传，方便排查
      - name: Prepare log dir
        run: mkdir -p ci-logs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile 2>&1 | tee ci-logs/install.log

      - name: Show versions
        run: |
          node --version
          pnpm --version
        continue-on-error: true

      - name: Test
        run: pnpm test 2>&1 | tee ci-logs/test.log

      - name: Build
        run: pnpm build 2>&1 | tee ci-logs/build.log

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
